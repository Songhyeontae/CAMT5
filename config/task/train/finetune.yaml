defaults:
  - _self_
  - train/exp: ft

_target_: train.task.finetune.App
name: "train"
task_id: ${now:%Y-%m-%d_%H-%M-%S}

# default values for the traing task
train_config:
  _target_: train.config.TrainConfig
  device: "cpu"
  seed: 42
  shot: 1
  do_compile: False
  batch_size: 128
  grad_acc: 8
  optim_config:
    _target_: train.config.OptimConfig
    name: adamwscale
    weight_decay: 0.0
    base_lr: 1e-3
    total_steps: 50000
    grad_clip: 30.0
    lr_scheduler_config:
      _target_: train.config.SchedulerConfig
      name: cosine
      warmup_steps: 1000

  # If you want to evaluate the model during training,
  # you can set the following parameters
  eval_config:
    _target_: train.config.EvalConfig
    task: "text2mol"
    every_steps: 1000

  checkpoint:
    _target_: train.config.Checkpoint
    every_steps: 10000

  logging_config:
    _target_: train.config.LoggingConfig
    every_steps: 100
    accuracy: true
    grad_l2: true
    weights_l2: true

model_config:
  _target_: model.config.ModelConfig
  name: "google/t5-v1_1-base"
  representation_type: smiles
  load_model:
    _target_: model.config.LoadModel
    from_pretrained: false
  tokenizer_config:
    _target_: model.config.TokenizerConfig
    additional_tokens_paths:
      - "asset/mol_vocabs/frag.txt"
      - "asset/mol_vocabs/selfies.txt"

data_config:
  _target_: train.config.DataConfig
  num_workers: 8
  max_seq_len: 512
  max_target_len: 512
  max_num_instances_per_task: 100000
  add_task_name: False
  add_task_definition: True
  num_pos_examples: 0
  num_neg_examples: 0
  add_explanation: False
  tk_instruct: False
  exec_file_path: .data/ni_dataset.py
  data_dir: .data/splits/mol_text/text2mol_smiles_stereo
  task_dir: .data/tasks

