defaults:
  - _self_
  - train/exp: ct_pt_camt5

_target_: train.task.continual_pretrain.App
name: "train"
task_id: ${now:%Y-%m-%d_%H-%M-%S}

train_config:
  _target_: train.config.TrainConfig
  device: "cpu"
  seed: 42
  shot: 1
  do_compile: False
  batch_size: 16
  grad_acc: 2
  optim_config:
    _target_: train.config.OptimConfig
    name: adamwscale
    weight_decay: 0.0
    base_lr: 1e-3
    total_steps: 100000
    grad_clip: 30.0
    lr_scheduler_config:
      _target_: train.config.SchedulerConfig
      name: cosine
      warmup_steps: 1000

  eval_config:
    _target_: train.config.EvalConfig
    task: "mlm"
    total_steps: 100

  checkpoint:
    _target_: train.config.Checkpoint
    every_steps: 50000

  logging_config:
    _target_: train.config.LoggingConfig
    every_steps: 100
    accuracy: true
    grad_l2: true
    weights_l2: true

model_config:
  _target_: model.config.ModelConfig
  name: "google/t5-v1_1-base"
  representation_type: smiles
  load_model:
    _target_: model.config.LoadModel
    from_pretrained: true
  tokenizer_config:
    _target_: model.config.TokenizerConfig
    additional_tokens_paths:
      - "asset/mol_vocabs/frag.txt"
      - "asset/mol_vocabs/selfies.txt"

data_config:
  _target_: train.config.DataConfig
  num_workers: 8

  continual_pretrain_data_config:
    _target_: train.config.ContinualPretrainDataConfig
    t2m_data_ratio: 0.8
    input_length: 512

    t2m_data_path: ${oc.env:DATA_PATH}/tasks/pub_chem_data_v3.csv

    mlm_probability: 0.15
    mean_noise_span_length: 3.0
