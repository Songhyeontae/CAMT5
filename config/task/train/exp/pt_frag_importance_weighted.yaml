# @package task

_target_: train.task.pretrain.App
name: "train"
task_id: ${now:%Y-%m-%d_%H-%M-%S}

train_config:
  _target_: train.config.TrainConfig
  device: "gpu"
  seed: 42
  shot: 1
  do_compile: False
  batch_size: 16
  grad_acc: 2
  optim_config:
    _target_: train.config.OptimConfig
    name: adamwscale
    weight_decay: 0.0
    base_lr: 1e-3
    total_steps: 100000
    grad_clip: 30.0
    lr_scheduler_config:
      _target_: train.config.SchedulerConfig
      name: cosine
      warmup_steps: 1000

  eval_config:
    _target_: train.config.EvalConfig
    task: "mlm"
    total_steps: 100

  checkpoint:
    _target_: train.config.Checkpoint
    every_steps: 50000

  logging_config:
    _target_: train.config.LoggingConfig
    every_steps: 100
    accuracy: true
    grad_l2: true
    weights_l2: true

model_config:
  _target_: model.config.ModelConfig
  name: "google/t5-v1_1-base"
  representation_type: frag
  load_model:
    _target_: model.config.LoadModel
    from_pretrained: false
  tokenizer_config:
    _target_: model.config.TokenizerConfig
    additional_tokens_paths:
      - "asset/mol_vocabs/frag_stereo.txt"
      - "asset/mol_vocabs/selfies.txt"

data_config:
  _target_: train.config.DataConfig
  num_workers: 8

  mlm_data_config:
    _target_: train.config.MLMDataConfig
    mlm_probability: 0.15
    mean_noise_span_length: 3.0
    input_length: 512

  token_importance_config:
    _target_: train.config.TokenImportanceConfig
    token_importance: atom_count
    special_token_importance: 1

