      smiles: "/home/osikjs/hyeontae/CAMT5/logs/2024-11-13/debug_16-30-47/smiles_predictions.txt"
      selfies: "/home/osikjs/hyeontae/CAMT5/logs/2024-11-13/debug_16-31-21/selfies_predictions.txt"
      frag: "/home/osikjs/hyeontae/CAMT5/logs/2024-11-13/debug_16-01-28/frag_predictions.txt"

    confidence_config:
      confidence: len_norm_entropy

  device: gpu
  ensemble: true

