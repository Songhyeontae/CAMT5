    cache_paths:
      smiles: "/home/osikjs/hyeontae/CAMT5/logs/2024-11-13/debug_17-26-52/smiles_predictions.txt"
      selfies: "/home/osikjs/hyeontae/CAMT5/logs/2024-11-13/debug_17-27-37/selfies_predictions.txt"
