# @package task
eval_config:
  data_config:
    batch_size: 4
    data_path: ${oc.env:DATA_PATH}/molt5_splits/test_pcdes.csv

  predict_config:
    cache_paths:
      selfies: "/home/osikjs/CAMT5/logs/2025-01-27/debug_01-25-20/selfies_predictions.txt"

    confidence_config:
      confidence: neg_perplexity

  device: gpu
  ensemble: false

model_configs:
  - _target_: model.config.ModelConfig
    name: "google/t5-v1_1-base"
    checkpoint_path: "${oc.env:EXTERNAL_PATH}/checkpoints/hyeontae/ft_text2mol_selfies_micro_base_pcdes_1lr_2025-01-25_20-18-18_stereo/checkpoint-50000/pytorch_model.bin"
    representation_type: selfies
    load_model:
      _target_: model.config.LoadModel
      from_pretrained: false
    tokenizer_config:
      _target_: model.config.TokenizerConfig
      additional_tokens_paths:
        - "asset/mol_vocabs/frag.txt"
        - "asset/mol_vocabs/selfies.txt"
