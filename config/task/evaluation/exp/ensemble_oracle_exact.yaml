# @package task
eval_config:

  predict_config:
    # cache_paths:
    #   smiles: "/home/osikjs/hyeontae/CAMT5/logs/2024-11-12/debug_05-47-37/smiles_predictions.txt"
    #   selfies: "/home/osikjs/hyeontae/CAMT5/logs/2024-11-12/debug_05-45-41/selfies_predictions.txt"
    #   frag: "/home/osikjs/hyeontae/CAMT5/logs/2024-11-12/debug_05-46-14/frag_predictions.txt"

    confidence_config:
      confidence: oracle_exact

  device: gpu
  ensemble: true

model_configs:
  - _target_: model.config.ModelConfig
    name: "google/t5-v1_1-base"
    checkpoint_path: "${oc.env:EXTERNAL_PATH}/checkpoints/hyeontae/ft_text2mol_smiles_micro_base_w_pubchem_2025-01-23_15-53-12_stereo/checkpoint-50000/pytorch_model.bin"
    representation_type: smiles
    load_model:
      _target_: model.config.LoadModel
      from_pretrained: false
    tokenizer_config:
      _target_: model.config.TokenizerConfig
      additional_tokens_paths:
        - "asset/mol_vocabs/frag.txt"
        - "asset/mol_vocabs/selfies.txt"

  - _target_: model.config.ModelConfig
    name: "QizhiPei/biot5-base-text2mol"
    representation_type: selfies
    load_model:
      _target_: model.config.LoadModel
      from_pretrained: true
    tokenizer_config:
      _target_: model.config.TokenizerConfig
      model_max_length: 512
      add_special_tokens: false
