# @package task
eval_config:
  data_config:
    batch_size: 4
    data_path: ${oc.env:DATA_PATH}/molt5_splits/test_biot5.csv
  predict_config:
    confidence_config:
      confidence: neg_perplexity

  device: gpu
  ensemble: true

model_configs:
  # MolT5
  - _target_: model.config.ModelConfig
    name: "google/t5-v1_1-base"
    checkpoint_path: "${oc.env:EXTERNAL_PATH}/checkpoints/hyeontae/ft_text2mol_smiles_micro_base_w_pubchem_2025-01-23_15-53-12_stereo/checkpoint-50000/pytorch_model.bin"
    representation_type: smiles
    load_model:
      _target_: model.config.LoadModel
      from_pretrained: false
    tokenizer_config:
      _target_: model.config.TokenizerConfig
      additional_tokens_paths:
        - "asset/mol_vocabs/frag.txt"
        - "asset/mol_vocabs/selfies.txt"
  
  # Biot5
  - _target_: model.config.ModelConfig
    name: "QizhiPei/biot5-base-text2mol"
    representation_type: selfies
    load_model:
      _target_: model.config.LoadModel
      from_pretrained: true
    tokenizer_config:
      _target_: model.config.TokenizerConfig
      model_max_length: 512
      add_special_tokens: false
  
  # CAMT5
  - _target_: model.config.ModelConfig
    name: "google/t5-v1_1-large"
    checkpoint_path: "${oc.env:EXTERNAL_PATH}/checkpoints/hyeontae/ft_text2mol_frag_micro_large_camt5_v3_w_pubchem_1lr_gradclip_10_2025-01-25_17-33-16_stereo/checkpoint-50000/pytorch_model.bin"
    representation_type: frag
    load_model:
      _target_: model.config.LoadModel
      from_pretrained: false
    tokenizer_config:
      _target_: model.config.TokenizerConfig
      additional_tokens_paths:
        - "asset/mol_vocabs/frag_camt5_v3.txt"
        - "asset/mol_vocabs/selfies.txt"
